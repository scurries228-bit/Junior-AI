<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Junior AI — Войти</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;
  --surface:#13131a;
  --card:#1a1a24;
  --border:#2a2a3a;
  --accent:#7c5cfc;
  --accent2:#c084fc;
  --text:#f0f0ff;
  --muted:#8888aa;
  --success:#22c55e;
  --error:#ef4444;
}
body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.bg-orbs{
  position:fixed;inset:0;pointer-events:none;z-index:0;
}
.orb{
  position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;
}
.orb1{width:500px;height:500px;background:radial-gradient(circle,#7c5cfc,transparent);top:-100px;left:-100px;animation:float1 8s ease-in-out infinite}
.orb2{width:400px;height:400px;background:radial-gradient(circle,#c084fc,transparent);bottom:-80px;right:-80px;animation:float2 10s ease-in-out infinite}
.orb3{width:300px;height:300px;background:radial-gradient(circle,#06b6d4,transparent);top:50%;left:50%;transform:translate(-50%,-50%);animation:float3 6s ease-in-out infinite}
@keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,20px)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(-20px,-30px)}}
@keyframes float3{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.1)}}

.container{
  position:relative;z-index:1;
  width:100%;max-width:420px;
  padding:0 20px;
}
.logo{
  text-align:center;margin-bottom:32px;
}
.logo-mark{
  width:64px;height:64px;
  background:linear-gradient(135deg,#7c5cfc,#c084fc);
  border-radius:20px;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:28px;margin-bottom:12px;
  box-shadow:0 0 40px rgba(124,92,252,.4);
}
.logo h1{font-size:28px;font-weight:700;background:linear-gradient(135deg,#fff,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo p{color:var(--muted);font-size:14px;margin-top:4px}

.card{
  background:rgba(26,26,36,.8);
  border:1px solid var(--border);
  border-radius:24px;
  padding:32px;
  backdrop-filter:blur(20px);
  box-shadow:0 24px 64px rgba(0,0,0,.4);
}

.tabs{
  display:flex;background:var(--surface);border-radius:12px;padding:4px;margin-bottom:28px;
}
.tab{
  flex:1;padding:10px;text-align:center;border-radius:9px;cursor:pointer;font-size:14px;font-weight:500;color:var(--muted);transition:all .2s;border:none;background:none;
}
.tab.active{background:var(--card);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.3)}

.field{margin-bottom:18px}
.field label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:8px}
.field input{
  width:100%;padding:13px 16px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:12px;
  color:var(--text);
  font-size:15px;font-family:inherit;
  transition:border-color .2s,box-shadow .2s;
  outline:none;
}
.field input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(124,92,252,.15);
}
.field input::placeholder{color:var(--muted);opacity:.6}

.btn{
  width:100%;padding:14px;
  background:linear-gradient(135deg,#7c5cfc,#c084fc);
  border:none;border-radius:12px;
  color:#fff;font-size:15px;font-weight:600;font-family:inherit;
  cursor:pointer;transition:opacity .2s,transform .1s;
  margin-top:8px;
}
.btn:hover{opacity:.9}
.btn:active{transform:scale(.99)}

.msg{
  padding:12px 16px;border-radius:10px;font-size:14px;margin-bottom:16px;display:none;
}
.msg.error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#fca5a5}
.msg.success{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:#86efac}

.form-section{display:none}
.form-section.active{display:block}
</style>
</head>
<body>
<div class="bg-orbs">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
</div>
<div class="container">
  <div class="logo">
    <div class="logo-mark">🤖</div>
    <h1>Junior AI</h1>
    <p>Твой умный помощник</p>
  </div>
  <div class="card">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Войти</button>
      <button class="tab" onclick="switchTab('register')">Регистрация</button>
    </div>
    <div id="msg" class="msg"></div>

    <!-- LOGIN -->
    <div class="form-section active" id="loginForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com">
      </div>
      <div class="field">
        <label>Пароль</label>
        <input type="password" id="loginPass" placeholder="••••••••">
      </div>
      <button class="btn" onclick="doLogin()">Войти →</button>
    </div>

    <!-- REGISTER -->
    <div class="form-section" id="registerForm">
      <div class="field">
        <label>Имя пользователя</label>
        <input type="text" id="regUsername" placeholder="cooluser123">
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="you@example.com">
      </div>
      <div class="field">
        <label>Пароль</label>
        <input type="password" id="regPass" placeholder="Минимум 6 символов">
      </div>
      <button class="btn" onclick="doRegister()">Создать аккаунт →</button>
    </div>
  </div>
</div>
<script>
function switchTab(tab){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===(tab==='login'?0:1)));
  document.querySelectorAll('.form-section').forEach((f,i)=>f.classList.toggle('active',i===(tab==='login'?0:1)));
  hideMsg();
}
function showMsg(text,type){
  const el=document.getElementById('msg');
  el.textContent=text;el.className='msg '+type;el.style.display='block';
}
function hideMsg(){document.getElementById('msg').style.display='none'}

async function doLogin(){
  const email=document.getElementById('loginEmail').value.trim();
  const password=document.getElementById('loginPass').value;
  if(!email||!password)return showMsg('Заполни все поля','error');
  const r=await fetch('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
  const d=await r.json();
  if(d.ok)window.location='/';
  else showMsg(d.error,'error');
}
async function doRegister(){
  const username=document.getElementById('regUsername').value.trim();
  const email=document.getElementById('regEmail').value.trim();
  const password=document.getElementById('regPass').value;
  if(!username||!email||!password)return showMsg('Заполни все поля','error');
  if(password.length<6)return showMsg('Пароль минимум 6 символов','error');
  const r=await fetch('/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,email,password})});
  const d=await r.json();
  if(d.ok)window.location='/';
  else showMsg(d.error,'error');
}
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    if(document.getElementById('loginForm').classList.contains('active'))doLogin();
    else doRegister();
  }
});
</script>
</body>
</html>
