services:
  - type: web
    name: junior-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --bind 0.0.0.0:$PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: junior-ai-db
          property: connectionString

databases:
  - name: junior-ai-db
    databaseName: junior_ai
    user: junior_ai
